[project]
name = "reducer"
version = "0.0.0"
description = "VectorScape reducer service — embeddings + dim reduction + clustering."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.5",
    "pacmap>=0.7.3",
    "umap-learn>=0.5.6",
    "hdbscan>=0.8.38",
    "numpy>=1.26,<2.3",
    "pandas>=2.2",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
dev = "app.dev:main"
reducer-cli = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "reducer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
