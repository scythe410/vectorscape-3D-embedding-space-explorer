[project]
name = "reducer"
version = "0.0.0"
description = "VectorScape reducer service — embeddings + dim reduction + clustering."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.5",
    "pacmap>=0.7.3",
    "umap-learn>=0.5.6",
    "hdbscan>=0.8.38",
    "numpy>=1.26,<2.3",
    "pandas>=2.2",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "openai>=1.40",
    "arq>=0.26",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "pytest>=8",
    "httpx>=0.27",
    "coverage>=7",
    "pytest-cov>=7",
    "mypy>=1.13",
]

[project.scripts]
dev = "app.dev:main"
reducer-cli = "app.cli:main"
worker = "app.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "reducer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Type stubs for sentence-transformers / pacmap / umap / hdbscan / arq are
# either nonexistent or incomplete. We don't want untyped imports to flood
# the report; we still get real attribute/argument-type checks on our own
# code.
check_untyped_defs = true
warn_unused_ignores = true
exclude = "(tests/|samples/|reducer/)"
